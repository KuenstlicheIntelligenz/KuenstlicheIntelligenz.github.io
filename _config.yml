# Feed configuration
feed:
  posts_limit: 20
  excerpt_only: false
  
# Timezone for better date handling
timezone: Europe/Berlin

# _social usernames/URLs
#twitter_username: _jacobtomlinson
github_username:  KuenstlicheIntelligenz
