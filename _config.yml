# Footer
footer_left: "Built with <i class=\"fas fa-heart\"></i> by <a href=\"https://github.com/KuenstlicheIntelligenz\">aibab</a>"
footer_right: "&lt;/&gt; <a href=\"https://github.com/KuenstlicheIntelligenz/KuenstlicheIntelligenz.github.io\">Source</a> &nbsp;<i class=\"fab fa-github-alt\"></i>"

# Build settings
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: pretty
exclude: [vendor, Gemfile, Gemfile.lock, node_modules, gulpfile.js, package.json, _site]

# Modern Jekyll 4.3 features
future: true
show_drafts: false
incremental: false
profile: false
safe: false
livereload_port: 35729

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap

collections:
  social:
    output: true
    permalink: /lifestyle/:title/
  travel:
    output: true
    permalink: /travel/:title/
  kitesurf:
    output: true
    permalink: /kitesurf/:title/
  videos:
    output: true
    permalink: /videos/:title/

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values:
        layout: "post"
  -
    scope:
      path: ""
      type: "travel"
    values:
        layout: "gallery-post"
  -
    scope:
      path: ""
      type: "kitesurf"
    values:
        layout: "gallery-post"
  -
    scope:
      path: ""
      type: "social"
    values:
        layout: "gallery-post"
  -
    scope:
      path: ""
      type: "videos"
    values:
        layout: "video-post"