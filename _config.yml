# Build settings
markdown: kramdown

kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: pretty
exclude: [vendor, Gemfile, Gemfile.lock, node_modules, gulpfile.js, package.json, _site]

# Modern Jekyll 4.3 features
future: true
show_drafts: false
incremental: false
profile: false
safe: false
livereload_port: 35729

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-archives
  - jekyll-minifier

# Plugin configurations
jekyll-archives:
  enabled:
    - categories
    - tags
  layout: archive
  permalinks:
    category: '/category/:name/'
    tag: '/tag/:name/'

jekyll-minifier:
  remove_spaces_inside_tags: true
  remove_multi_spaces: true
  remove_comments: true
  remove_intertag_spaces: true
  remove_quotes: false
  compress_css: true
  compress_javascript: true

collections:
  social:
    output: true

defaults:
  - 
    scope:
      path: ""
      type: "posts"
    values:
        layout: "post"