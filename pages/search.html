---
layout: default
permalink: /search/
---

<div class="container-fluid index">
  <div class="row index all-posts">

    <h1 class="header author-header"><i class="fas fa-search"></i> Search LoveIsTheHack</h1>
    <p class="search-description">Find posts, tutorials, research, and more. Search by title, content, tags, or categories.</p>

    <div id="search-container" class="col-md-12">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search for deep learning, tutorials, cloud tips..." class="form-control form-control-lg" autocomplete="off">
        <div class="search-stats" id="search-stats"></div>
      </div>
      
      <div class="search-filters mt-3">
        <div class="btn-group" role="group">
          <input type="radio" class="btn-check" name="searchFilter" id="filter-all" value="all" checked>
          <label class="btn btn-outline-primary" for="filter-all">All</label>
          
          <input type="radio" class="btn-check" name="searchFilter" id="filter-posts" value="posts">
          <label class="btn btn-outline-primary" for="filter-posts">Posts</label>
          
          <input type="radio" class="btn-check" name="searchFilter" id="filter-tutorials" value="tutorials">
          <label class="btn btn-outline-primary" for="filter-tutorials">Tutorials</label>
          
          <input type="radio" class="btn-check" name="searchFilter" id="filter-research" value="research">
          <label class="btn btn-outline-primary" for="filter-research">Research</label>
        </div>
      </div>

      <div class="col-md-12 content-panel articles mt-4">
        <div id="results-container">
          <div class="search-placeholder">
            <i class="fas fa-search fa-3x text-muted mb-3"></i>
            <p>Start typing to discover awesome content...</p>
            <small class="text-muted">Try searching for "machine learning", "kubernetes", or "python"</small>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<hr class="search-hr" />

<script src="{{ site.baseurl }}/js/jekyll-search.js" type="text/javascript"></script>

<script type="text/javascript">
  SimpleJekyllSearch.init({
    searchInput: document.getElementById('search-input'),
    resultsContainer: document.getElementById('results-container'),
    dataSource: '{{ site.baseurl }}/search.json',
    searchResultTemplate: '<li><a href="{url}" title="{desc}">{title}<\/a><\/li>',
    noResultsText: 'No results found',
    limit: 10,
    fuzzy: true,
  })
</script>
